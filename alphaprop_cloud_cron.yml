name: AlphaProp Pro™ 3-Pulse NBA & 4-Wave NFL Cloud Cron Pipeline

on:
  schedule:
    # NBA Pulse 1 (5:00 AM CT / 11:00 UTC daily): Overnight Box-Score Grading + Early Opener CLV Snipers
    - cron: "0 11 * * *"
    # NBA Pulse 2 (12:30 PM CT / 18:30 UTC daily): Midday B2B, Shootaround & Alt-Floor Recalibration
    - cron: "30 18 * * *"
    # NBA Pulse 3 (4:45 PM CT / 22:45 UTC daily): Pre-Tip VIP/SGP Lock + Discord/SMS/Push Webhooks
    - cron: "45 22 * * *"
    # NFL Wave 2 (Thu 6:30 PM CT / Fri 00:30 UTC): TNF 90-Minute Inactive Lock
    - cron: "30 0 * * 5"
    # NFL Wave 3 (Sun 10:35 AM CT / 16:35 UTC): Sunday 90-Minute Pre-Kickoff Inactive Cascade
    - cron: "35 16 * * 0"
    # NFL Wave 4/1 (Mon 5:45 PM CT / 23:45 UTC): MNF 90-Minute Lock & Sunday Box-Score Grading
    - cron: "45 23 * * 1"
  workflow_dispatch:
    inputs:
      wave:
        description: "Execution Wave"
        required: true
        default: "pulse3"
        type: choice
        options:
          - pulse1
          - pulse2
          - pulse3
          - nfl_wave
          - grade_overnight
      sport:
        description: "Target Sport"
        required: true
        default: "nba"
        type: choice
        options:
          - nba
          - nfl

permissions:
  contents: write

jobs:
  run-alphaprop-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy fastapi pydantic uvicorn httpx

      - name: Determine Scheduled Wave & Sport
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "wave=${{ inputs.wave }}" >> $GITHUB_OUTPUT
            echo "sport=${{ inputs.sport }}" >> $GITHUB_OUTPUT
          else
            CRON="${{ github.event.schedule }}"
            case "$CRON" in
              "0 11 * * *")  echo "wave=pulse1" >> $GITHUB_OUTPUT; echo "sport=nba" >> $GITHUB_OUTPUT ;;
              "30 18 * * *") echo "wave=pulse2" >> $GITHUB_OUTPUT; echo "sport=nba" >> $GITHUB_OUTPUT ;;
              "45 22 * * *") echo "wave=pulse3" >> $GITHUB_OUTPUT; echo "sport=nba" >> $GITHUB_OUTPUT ;;
              *)             echo "wave=nfl_wave" >> $GITHUB_OUTPUT; echo "sport=nfl" >> $GITHUB_OUTPUT ;;
            esac
          fi

      - name: Execute AlphaProp Pro™ Cron Runner (v9.2 Engine + Alerts)
        env:
          UNABATED_API_KEY: ${{ secrets.UNABATED_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
        run: |
          python alphaprop_cron_runner.py \
            --wave "${{ steps.meta.outputs.wave }}" \
            --sport "${{ steps.meta.outputs.sport }}" \
            --slate-json today_slate.json \
            --clv-db alphaprop_clv_ledger.sqlite \
            --alerts-db alphaprop_alerts.sqlite

      - name: Commit & Publish Live JSON Feed
        run: |
          git config user.name "AlphaProp-Cloud-Cron"
          git config user.email "cron@alphaprop.pro"
          git add today_slate.json
          git diff --staged --quiet || git commit -m "chore(cron): ${{ steps.meta.outputs.sport }} ${{ steps.meta.outputs.wave }} live sync"
          git push
